<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FSD Experiment Runner</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      color: var(--text);
    }
    .shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }
    .label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .back-btn {
      text-decoration: none;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .app-shell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      min-height: 75vh;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }
    #root {
      min-height: 75vh;
    }
    .error-box {
      padding: 32px;
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 16px;
      font-family: Consolas, monospace;
      white-space: pre-wrap;
      margin: 20px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <div class="label">FSD Demo</div>
        <div class="title" id="experimentTitle">Loading experiment...</div>
      </div>
      <a class="back-btn" href="index (1).html">← Back to Index</a>
    </div>

    <div class="app-shell">
      <div id="root"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileName = params.get('file');
    const titleEl = document.getElementById('experimentTitle');

    if (!fileName) {
      document.getElementById('root').innerHTML = '<div class="error-box">No experiment file was specified.</div>';
      throw new Error('Missing file query parameter');
    }

    titleEl.textContent = fileName.replace(/\.tsx$/, '').replace(/_/g, ' ');

    const makeFallbackIcon = (name) => {
      const Icon = (props) => {
        const svgProps = {
          ...props,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: 2,
          strokeLinecap: 'round',
          strokeLinejoin: 'round'
        };
        return React.createElement('svg', svgProps,
          React.createElement('path', { d: 'M5 12h14M12 5v14' })
        );
      };
      Icon.displayName = name;
      return Icon;
    };

    function getIconMapFromSource(code) {
      const iconListText = code.match(/import\s*\{\s*([\s\S]*?)\s*\}\s*from\s*['"]lucide-react['"]/);
      const names = iconListText ? iconListText[1].split(',').map(item => {
        const cleaned = item.trim();
        return cleaned.replace(/\s+as\s+\w+/, '').trim();
      }).filter(Boolean) : [];

      const map = {};
      names.forEach(name => {
        map[name] = makeFallbackIcon(name);
      });
      return map;
    }

    async function renderExperiment() {
      try {
        const response = await fetch(fileName);
        if (!response.ok) {
          throw new Error('Unable to fetch ' + fileName + ' (' + response.status + ')');
        }

        const source = await response.text();
        const lucideReact = getIconMapFromSource(source);

        let cleaned = source
          .replace(/import\s+[\s\S]*?from\s*['"][^'"]+['"];?\s*/g, '')
          .replace(/import\s+['"][^'"]+['"];?\s*/g, '')
          .replace(/export default\s+/g, 'const App = ')
          .replace(/export\s+const\s+([A-Za-z0-9_]+)\s*=/g, 'const $1 =')
          .replace(/export\s+function\s+([A-Za-z0-9_]+)\s*\(/g, 'function $1(');

        const reactBindings = `
          const { useState, useEffect, useMemo, useCallback, useContext, createContext } = React;
          const { useDispatch, useSelector, Provider } = window.__mockReactRedux || {};
        `;

        const iconBindings = Object.keys(lucideReact).length
          ? `const { ${Object.keys(lucideReact).join(', ')} } = lucideReact;`
          : '';

        const transpiled = Babel.transform(`${reactBindings}\n${iconBindings}\n${cleaned}`, {
          presets: ['react', 'typescript']
        }).code;

        const runner = new Function('React', 'ReactDOM', 'lucideReact', `${transpiled}; return App || window.__defaultApp || null;`);
        const App = runner(React, ReactDOM, lucideReact);

        if (!App) {
          throw new Error('The experiment file did not export a valid React component.');
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
      } catch (error) {
        console.error(error);
        document.getElementById('root').innerHTML = '<div class="error-box">' + (error && error.stack ? error.stack : String(error)) + '</div>';
      }
    }

    renderExperiment();
  </script>
</body>
</html>
